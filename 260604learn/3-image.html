<!-- 声明这是一个 HTML5 文档，告诉浏览器使用 HTML5 标准解析页面 -->
<!DOCTYPE html>

<!-- HTML 文档的根标签，lang="zh-CN" 指定页面语言为简体中文 -->
<html lang="zh-CN">

<!-- head 部分：包含页面的元数据（不可见的信息），如字符编码、标题等 -->
<head>
  <!-- 指定页面的字符编码为 UTF-8，支持中文显示 -->
  <meta charset="utf-8">
  
  <!-- 视口设置：让页面在移动端正确显示，width=device-width 表示宽度等于设备屏幕宽度，initial-scale=1.0 表示初始缩放比例为1 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- 页面标题：显示在浏览器标签页上的文字 -->
  <title>3.Image 练习</title>
</head>

<!-- body 部分：包含页面的可见内容，所有显示在浏览器窗口中的内容都在这里 -->
<body>
  <!-- h1 标签：一级标题，通常用于页面的主标题，字体最大 -->
  <h1>3.Image 练习</h1>
  
  <!-- ul 标签：无序列表（Unordered List），用于创建项目符号列表 -->
  <ul>
    <!-- li 标签：列表项（List Item），是 ul 或 ol 的子元素 -->
    <!-- a 标签：超链接（Anchor），href 属性指定链接目标地址 -->
    <li><a href="2-link.html">Go to the second html</a></li>
    <li><a href="4-text.html">Go to the fourth html</a></li>
  </ul>
  
  <!-- h2 标签：二级标题，字体比 h1 小 -->
  <!-- strong 标签：加粗文本，使文字变粗强调重要内容 -->
  <h2><strong>This is an image of NNU logo.</strong></h2>
  
  <!-- img 标签：插入图片（Image）
       src 属性：指定图片文件的路径
       width/height 属性：设置图片的宽度和高度（单位：像素）
       alt 属性：图片无法显示时的替代文本，也用于屏幕阅读器 -->
  <img src="logo.jpg" width="200" height="200" alt="logo">
</body>
</html>
