<!DOCTYPE html>               <!-- 声明文档类型为 HTML5 -->
<html lang="zh">              <!-- html 根元素，lang="zh" 表示页面语言是中文 -->
<head>                        <!-- head 头部区域，存放页面的元信息（不直接显示在页面上） -->
  <meta charset="UTF-8">      <!-- 设置字符编码为 UTF-8，支持中文等多语言字符 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- viewport 设置：width=device-width 让页面宽度等于设备宽度，initial-scale=1.0 初始缩放比例为 1 -->
  <title>4.text 练习</title>  <!-- 页面标题，显示在浏览器标签页上 -->
</head>                       <!-- head 结束 -->
<body>                        <!-- body 主体区域，存放页面上显示的内容 -->
  <h1>4.text 练习</h1>
  <ul>
    <li><a href="3-image.html">Go to the third html</a></li>
    <li><a href="5-label.html">Go to the fifth html</a></li>
  </ul>

  <h2>改变字体样式</h2>
  <p>正常</p>
  <p><b>粗体</b></p>
  <p><i>斜体</i></p>
  <p><u>下划线</u></p>
  <p><s>删除线</s></p>
  <p><sub>下标</sub></p>
  <p><sup>上标</sup></p>

  <h2>无序列表元素</h2>
  <ul>                        <!-- ul 无序列表（unordered list），列表项前面是圆点 -->
    <li>无序列表元素1</li>
    <li>无序列表元素2</li>
    <li>无序列表元素3</li>
  </ul>                       <!-- ul 无序列表结束 -->

  <h2>有序列表元素</h2>
  <ol>                        <!-- ol 有序列表（ordered list），列表项前面是数字 -->
    <li>有序列表元素1</li>
    <li>有序列表元素2</li>
    <li>有序列表元素3</li>
  </ol>                       <!-- ol 有序列表结束 -->

  <h2>表格元素</h2>

  <h3>行标签：table row</h3>
  <h3>列标题：table header</h3>
  <h3>表格数据：table data</h3>
  
  <table border="1">              <!-- table 表格元素，border="1" 设置表格边框宽度为 1 像素 -->
    <tr>
      <th>列标题1</th>
      <th>列标题2</th>
      <th>列标题3</th>
    </tr>
    <tr>
      <td>数据1</td>
      <td>数据2</td>
      <td>数据3</td>
    </tr>
    <tr>
      <td>数据4</td>
      <td>数据5</td>
      <td>数据6</td>
    </tr>
    <tr>
      <td>数据7</td>
      <td>数据8</td>
      <td>数据9</td>
    </tr>
  </table>

</body>                       <!-- body 结束 -->
</html>                       <!-- html 根元素结束 -->
